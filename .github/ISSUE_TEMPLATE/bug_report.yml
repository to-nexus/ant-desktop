name: Bug report
description: Report a problem with the Ant Desktop bridge
title: "bug: <short summary>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a report.

        Before submitting:
        - Search [existing issues](../search?q=is%3Aissue) to avoid duplicates.
        - Security vulnerabilities go privately through
          [SECURITY.md](../../blob/main/SECURITY.md), not a public issue.
        - Bugs in the Ant platform itself (jobs, agents, the web UI) belong in
          [to-nexus/ant](https://github.com/to-nexus/ant/issues). This repo is
          only the Figma MCP bridge.

  - type: input
    id: app-version
    attributes:
      label: Ant Desktop version
      description: Shown in the app, or the tag / commit you built from.
      placeholder: "e.g. 0.1.3 or commit a1b2c3d"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.2 (Apple Silicon)"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Backend target
      multiple: false
      options:
        - Managed cloud
        - Self-hosted ant-realtime
        - Not connected / unsure
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part is failing?
      multiple: false
      options:
        - Backend connection (WebSocket)
        - Figma MCP relay
        - Sign-in / deep link
        - Tray or window
        - Build / install
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The user-visible symptom and any error message.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      value: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        From the app's Logs tab. Redact tokens, backend URLs you consider
        private, and anything else sensitive.
      render: shell

  - type: checkboxes
    id: prereqs
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched for existing issues and didn't find a duplicate.
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md).
          required: true
        - label: I redacted tokens and other secrets from any logs I pasted.
          required: true
