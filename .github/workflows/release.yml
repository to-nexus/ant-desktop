name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: [macOS]
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: [macOS]
            args: '--target x86_64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # - platform: ubuntu-24.04
          #   args: ''
          #   rust_targets: ''
          # - platform: windows-latest
          #   args: ''
          #   rust_targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          # macOS signing (서명 인증서 확보 후 주석 해제)
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ant Desktop ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  upload-cdn:
    name: Upload to CDN
    needs: [release]
    runs-on: [arc-runner-set]
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p artifacts
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --dir artifacts \
            --pattern '*.dmg' \
            --pattern '*.exe' \
            --pattern '*.deb' \
            --pattern '*.AppImage'

      - name: Rename artifacts
        run: |
          mkdir -p renamed
          for f in artifacts/*_aarch64.dmg; do [ -f "$f" ] && cp "$f" renamed/macos-arm64.dmg; done
          for f in artifacts/*_x86_64.dmg; do [ -f "$f" ] && cp "$f" renamed/macos-x64.dmg; done
          for f in artifacts/*_x64-setup.exe; do [ -f "$f" ] && cp "$f" renamed/windows-x64.exe; done
          for f in artifacts/*_amd64.deb; do [ -f "$f" ] && cp "$f" renamed/linux-x64.deb; done
          for f in artifacts/*_amd64.AppImage; do [ -f "$f" ] && cp "$f" renamed/linux-x64.AppImage; done
          echo "### Renamed artifacts" >> $GITHUB_STEP_SUMMARY
          ls -lh renamed/ >> $GITHUB_STEP_SUMMARY

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.CDN_ACCOUNT_ID }}:role/${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3 (versioned)
        run: |
          TAG="${{ github.ref_name }}"
          BUCKET="${{ vars.S3_BUCKET_NAME }}"
          aws s3 sync renamed/ "s3://${BUCKET}/downloads/desktop/${TAG}/" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Update latest
        run: |
          TAG="${{ github.ref_name }}"
          BUCKET="${{ vars.S3_BUCKET_NAME }}"
          aws s3 sync "s3://${BUCKET}/downloads/desktop/${TAG}/" "s3://${BUCKET}/downloads/desktop/latest/" \
            --delete \
            --cache-control "public, max-age=3600" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront cache
        run: |
          TAG="${{ github.ref_name }}"
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/downloads/desktop/${TAG}/*" "/downloads/desktop/latest/*"

      - name: Upload summary
        run: |
          TAG="${{ github.ref_name }}"
          BUCKET="${{ vars.S3_BUCKET_NAME }}"
          echo "## CDN Upload Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${TAG}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bucket**: ${BUCKET}" >> $GITHUB_STEP_SUMMARY
          echo "- **Versioned path**: downloads/desktop/${TAG}/" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest path**: downloads/desktop/latest/" >> $GITHUB_STEP_SUMMARY
