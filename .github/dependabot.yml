version: 2

# MAJORS ARE NOT DELEGATED TO DEPENDABOT — read before removing an `ignore`.
#
# Dependabot edits manifests and lockfiles; it cannot edit source. A major
# release almost always needs source work too, so the PR it opens is either
# red on arrival or needs a human migration anyway. Tailwind v4 was the
# worked example: the bump alone died on the PostCSS plugin split, and the
# real change also had to rewrite the CSS entrypoint, delete the JS config,
# and rename `outline-none`.
#
# So majors are planned by hand and minor/patch stay automated. Note the 0.x
# case: Dependabot classifies `0.26 -> 0.30` as semver-major, so cargo crates
# still on 0.x are covered by the same rule.
#
# Caveat: `ignore` can also suppress the auto-PR for a Dependabot SECURITY
# update. Dependabot ALERTS still fire either way, so a real advisory stays
# visible — it just has to be actioned by hand.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
